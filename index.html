<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e4d3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Fatura compartilhada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f2f1eb;--card:#fff;--tx:#14241c;--mut:#6b7a70;--line:#e6e4da;--g:#1e4d3b;--g2:#143828;--soft:#dbe8d8;--ac:#1e4d3b;--c0:#1e4d3b;--c1:#4f8a68;--c2:#a8721a;--on:#fff;--r:22px}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e1411;--card:#17201b;--tx:#eef2ee;--mut:#98a79d;--line:#26322b;--g:#2c6a50;--g2:#1b4635;--soft:#223a2f;--ac:#8fd0a8;--c0:#5fae88;--c1:#8bc3a2;--c2:#e3b254;--on:#0e1411}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0e1411;--card:#17201b;--tx:#eef2ee;--mut:#98a79d;--line:#26322b;--g:#2c6a50;--g2:#1b4635;--soft:#223a2f;--ac:#8fd0a8;--c0:#5fae88;--c1:#8bc3a2;--c2:#e3b254;--on:#0e1411}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin:26px 0 12px}
.mut{color:var(--mut);font-size:13px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center}
.hero{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;border-radius:var(--r);padding:20px 20px 18px;box-shadow:0 12px 28px -14px rgba(20,56,40,.7)}
.hl{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.9;gap:10px}
.pill{background:rgba(255,255,255,.16);border-radius:99px;padding:2px 10px;font-size:12px}.pill:empty{display:none}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.mpill input{background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:9px 12px;color:#fff;color-scheme:dark;width:auto}
.acts{display:flex;gap:12px;margin:18px 0 4px;justify-content:space-around}
.act{display:grid;justify-items:center;gap:6px;background:none;border:0;font-size:13px;font-weight:500;width:96px}
.act b{width:56px;height:56px;border-radius:18px;background:var(--card);display:grid;place-items:center;color:var(--ac);font-weight:400}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.hb{display:flex;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:6px 16px;border:1px solid var(--line)}
.sum{display:grid;gap:10px;margin-top:18px}
.who{display:flex;align-items:center;gap:12px;padding:14px 16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.who b{font-weight:600;flex:1}.who .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.ghost{background:var(--soft);border:0;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ac)}
.row{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.rb{flex:1;min-width:0}
.l{display:flex;justify-content:space-between;gap:12px}
.d{overflow-wrap:anywhere;font-weight:500;line-height:1.35}
.v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.tag{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
select.cat,input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select.cat{margin-top:8px;width:auto;max-width:100%;padding:5px 10px;font-size:13px;border-radius:99px;color:var(--mut)}
.pick{display:flex;gap:6px;margin-top:8px}
.pick button{flex:1;border:1px solid var(--line);background:none;border-radius:99px;padding:6px 0;font-size:13px;color:var(--mut)}
.pick button.on{color:var(--on);border-color:transparent;font-weight:600}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:600}
.link{background:none;border:0}
.login{margin-top:12vh;display:grid;gap:10px}.login p{margin:0 0 8px}
.empty{text-align:center;padding:28px 8px}
.donut{width:176px;height:176px;border-radius:50%;margin:14px auto;display:grid;place-items:center}
.dc{width:116px;height:116px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center}
.dc b{font-size:19px;font-variant-numeric:tabular-nums}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:6px 0 12px;font-size:14px}
.leg span{display:flex;align-items:center;gap:8px}.leg em{font-style:normal;color:var(--mut);margin-left:auto}
.bars{display:flex;gap:8px;height:190px;padding:14px 0 8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;gap:6px;min-width:0}
.bv{height:20px;font-size:11px;font-weight:700;white-space:nowrap}
.col{flex:1;width:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;border-radius:10px;background:var(--soft)}
.bar.pv .col i{background:repeating-linear-gradient(135deg,var(--soft) 0 5px,transparent 5px 9px);border:1px dashed var(--mut)}
.bar.sel .col i{background:var(--g);border:0}
.bl{font-size:12px;color:var(--mut)}
.mes{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 0}
.mes:first-child{border-top:0}.mes>span:first-child{display:grid}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(360px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;padding:6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35)}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;background:none;border:0;border-radius:20px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--g);color:#fff}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="login" class="login" hidden>
  <h1>Fatura compartilhada</h1>
  <p class="mut">Entre para ver os seus gastos do cartão.</p>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username">
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="btn" data-act="entrar">Entrar</button>
</section>

<section id="app" hidden>
  <header class="top"><div><div class="mut">Olá,</div><h1 id="ola"></h1></div><div class="hb"><button class="round" id="tema" data-act="tema" aria-label="Mudar tema"></button><button class="round" data-act="sair" aria-label="Sair"><svg viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></header>
  <div class="hero">
    <div class="hl"><span id="hlt">Total do mês</span><span class="pill" id="hp"></span></div>
    <div class="big" id="total">R$ 0,00</div>
    <label class="mpill"><input id="mes" type="month" aria-label="Mês da fatura"></label>
  </div>
  <div class="acts" id="acts" hidden>
    <label class="act"><b><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 20h16"/></svg></b>Enviar fatura<input id="csv" type="file" accept=".csv,text/csv" hidden></label>
    <button class="act" data-act="salvar"><b><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></b>Salvar</button>
  </div>
  <div id="v-gastos">
    <div class="sum" id="sum"></div>
    <h2 id="tl">Gastos</h2>
    <div class="chips" id="chips"></div>
    <div class="card" id="list"></div>
  </div>
  <div id="v-analise" hidden>
    <h2>Gastos por categoria</h2>
    <div class="card" id="donut"></div>
  </div>
  <div id="v-prev" hidden>
    <h2>Evolução e previsão</h2>
    <div class="card" id="bars"></div>
    <h2>Parcelas dos próximos meses</h2>
    <div class="card" id="prev"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="on" data-act="aba" data-a="gastos"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Gastos</button>
    <button data-act="aba" data-a="analise"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análise</button>
    <button data-act="aba" data-a="prev"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Previsão</button>
  </nav>
</section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== CONFIGURE AQUI ====== */
const SUPABASE_URL = 'https://omobvxdlytdqgzznmhso.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hc6Cu58Q14nzMsqOkG5wgQ_GkD8rvbA';
const PESSOAS = ['Larissa', 'Nice', 'Milton'];
/* ============================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtD = d => d ? d.slice(8) + '/' + d.slice(5, 7) : '';
const norm = d => d.toLowerCase().replace(/\d+\s*\/\s*\d+/g, '').replace(/\s+/g, ' ').trim();
const cor = p => `var(--c${PESSOAS.indexOf(p)})`;
let perfil = null, rows = [], regras = {}, regCat = {}, cats = [], mes = new Date().toISOString().slice(0, 7);

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2200); }

/* ---------- Parcelas e categorias ---------- */
const RP = [/(parcela\s*)(\d{1,2})(\s*\/\s*)(\d{1,2})/i, /()(\d{1,2})(\s*\/\s*)(\d{1,2})\s*$/];
function parc(d) { for (const re of RP) { const m = d.match(re); if (m && +m[4] <= 60 && +m[2] >= 1 && +m[2] < +m[4]) return {n: +m[2], N: +m[4], re}; } return null; }
const futuro = (d, p, k) => d.replace(p.re, (m, a, n, s, N) => a + (p.n + k) + s + N);
const addMes = (m, k) => { const [y, mm] = m.split('-').map(Number), d = new Date(y, mm - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const nomeMes = m => new Date(m + '-01T12:00').toLocaleDateString('pt-BR', {month: 'short', year: 'numeric'});
const sa = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const DIC = [['Mercado', /mercado|supermerc|atacad|assai|carrefour|hortifruti|sacolao|acougue/], ['Alimentação', /ifood|restaur|lanch|padaria|pizza|burger|cafe|sorvet|mcdonald|confeit|doceria|pastel/],
  ['Transporte', /uber|\b99\b|posto|shell|ipiranga|combust|estacion|pedagio|sem parar|conectcar|taxi/], ['Saúde', /farmac|drogar|droga|raia|clinic|hospital|laborat|unimed|dent/],
  ['Assinaturas', /netflix|spotify|disney|hbo|prime video|youtube|google one|icloud|apple\.com|globoplay|deezer|assinatura/], ['Compras', /amazon|mercado ?livre|shopee|aliexpress|magalu|magazine|americanas|shein|renner|zara|c&a|riachuelo|kabum/],
  ['Casa', /leroy|telha|movel|constru|eletro/], ['Educação', /curso|escola|facul|udemy|livraria|colegio/], ['Lazer', /cinema|ingresso|steam|playstation|hotel|airbnb|booking|viagem/]];
const grupo = dono => (dono === 'Nice' || dono === 'Milton') ? 'dupla' : 'admin';
function autoCat(desc, dono) {
  const k = regCat[grupo(dono) + ':' + norm(desc)]; if (k) return k;
  const t = sa(desc); const h = DIC.find(([, re]) => re.test(t)); return h ? h[0] : null;
}
async function setCat(i, cat) {
  if (cat === '__novo__') {
    cat = (prompt('Nome da nova categoria:') || '').trim();
    if (!cat) return render();
    cat = cat[0].toUpperCase() + cat.slice(1);
    if (!cats.includes(cat)) { await sb.from('categorias').upsert({nome: cat}, {onConflict: 'nome', ignoreDuplicates: true}); cats.push(cat); cats.sort(); }
  }
  const r = rows[i]; r.categoria = cat || null;
  if (r.id) { const {error} = await sb.rpc('definir_categoria', {p_id: r.id, p_categoria: r.categoria}); if (error) toast(error.message); }
  if (cat) { const g = grupo(r.dono); regCat[g + ':' + norm(r.descricao)] = cat; sb.from('regras_categoria').upsert({grupo: g, descricao: norm(r.descricao), categoria: cat}); }
  render();
}

/* ---------- CSV ---------- */
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const f = t.split(/\r?\n/)[0];
  const sep = (f.match(/;/g) || []).length > (f.match(/,/g) || []).length ? ';' : ',';
  const out = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); out.push(r); r = []; c = ''; }
    else c += ch;
  }
  if (c || r.length) { r.push(c); out.push(r); }
  return out.filter(x => x.some(y => y.trim()));
}
function num(s) { s = String(s).replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); }
function toISO(s) {
  s = s.trim(); let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : null;
}
function importCSV(text) {
  const t = parseCSV(text), h = t[0].map(x => x.toLowerCase());
  const ix = (re, not = -1) => h.findIndex((x, i) => i !== not && re.test(x));
  const iD = ix(/data|date/), iT = ix(/descri|t[ií]tulo|title|hist|estabel|lan[cç]amento/, iD), iV = ix(/valor|amount|value/);
  if (iD < 0 || iT < 0 || iV < 0) return toast('Não achei as colunas de data, descrição e valor.');
  rows = t.slice(1).map(r => ({data: toISO(r[iD] || ''), descricao: (r[iT] || '').trim(), valor: num(r[iV]), previsto: false}))
    .filter(r => r.descricao && !isNaN(r.valor) && !/pagamento\s+recebido/.test(sa(r.descricao)))
    .map(r => { const dono = regras[norm(r.descricao)] || null; return {...r, dono, categoria: autoCat(r.descricao, dono)}; });
  render();
  const np = rows.filter(r => parc(r.descricao)).length;
  toast(rows.length + ' gastos importados' + (np ? ` (${np} parcelados)` : '') + '. Confira e salve.');
}

/* ---------- Dados ---------- */
async function carregar() {
  const {data, error} = await sb.from('gastos').select('*').eq('mes', mes).order('previsto').order('data');
  if (error) return toast(error.message);
  rows = data; render(); previsao();
}
async function salvar() {
  const mk = (r, m, prev, desc) => ({mes: m, data: prev ? null : r.data, descricao: desc || r.descricao, valor: r.valor, dono: r.dono, categoria: r.categoria || null, previsto: prev});
  const ins = rows.map(r => mk(r, mes, r.previsto));
  let r = await sb.from('gastos').delete().eq('mes', mes);
  if (r.error) return toast(r.error.message);
  const reais = rows.filter(x => !x.previsto);
  const {data: pos} = await sb.from('gastos').select('mes').eq('previsto', false).gt('mes', mes).limit(1);
  if (reais.length && !(pos || []).length) {
    await sb.from('gastos').delete().eq('previsto', true).gt('mes', mes);
    reais.forEach(x => { const p = parc(x.descricao); if (p) for (let k = 1; k <= p.N - p.n; k++) ins.push(mk(x, addMes(mes, k), true, futuro(x.descricao, p, k))); });
  }
  if (ins.length) { r = await sb.from('gastos').insert(ins); if (r.error) return toast(r.error.message); }
  const m = {}; rows.forEach(x => x.dono && (m[norm(x.descricao)] = x.dono));
  const rg = Object.entries(m).map(([descricao, dono]) => ({descricao, dono}));
  if (rg.length) await sb.from('regras').upsert(rg);
  Object.assign(regras, m);
  const rc = {}; rows.forEach(x => x.categoria && (rc[grupo(x.dono) + '|' + norm(x.descricao)] = x.categoria));
  const lc = Object.entries(rc).map(([k, categoria]) => { const [g, descricao] = k.split('|'); regCat[g + ':' + descricao] = categoria; return {grupo: g, descricao, categoria}; });
  if (lc.length) await sb.from('regras_categoria').upsert(lc);
  await carregar(); toast('Fatura salva');
}
async function previsao() {
  const {data} = await sb.from('gastos').select('mes,dono,valor,previsto').order('mes');
  const g = {};
  (data || []).forEach(x => {
    const o = g[x.mes] || (g[x.mes] = {t: 0, pv: false, pt: 0, p: {}});
    if (x.dono && x.valor > 0) o.t += Number(x.valor);
    if (x.previsto) { o.pv = true; o.pt += Number(x.valor); const k = x.dono || '-'; o.p[k] = (o.p[k] || 0) + Number(x.valor); }
  });
  const ms = Object.keys(g).sort(), max = Math.max(1, ...ms.map(m => g[m].t)), bs = ms.slice(-8);
  const curto = m => nomeMes(m).split(' ')[0].replace('.', '');
  $('#bars').innerHTML = bs.length ? `<div class="bars">${bs.map(m => `<button class="bar${g[m].pv ? ' pv' : ''}${m === mes ? ' sel' : ''}" data-act="mes" data-m="${m}" aria-label="${nomeMes(m)}"><span class="bv">${m === mes ? brl(g[m].t) : ''}</span><span class="col"><i style="height:${Math.max(5, g[m].t / max * 100)}%"></i></span><span class="bl">${curto(m)}</span></button>`).join('')}</div>` : '<div class="empty mut">Ainda sem dados.</div>';
  const fut = ms.filter(m => g[m].pv);
  $('#prev').innerHTML = fut.length ? fut.map(m => `<button class="mes" data-act="mes" data-m="${m}"><span><b>${nomeMes(m)}</b><span class="mut">${Object.entries(g[m].p).map(([k, v]) => k + ' ' + brl(v)).join(' · ')}</span></span><span class="v">${brl(g[m].pt)}</span></button>`).join('') : '<div class="empty mut">Nenhuma parcela futura encontrada. Envie e salve uma fatura com compras parceladas.</div>';
}
function mensagem(p) {
  const l = rows.filter(r => r.dono === p), [y, m] = mes.split('-');
  return `Oi, ${p}! Fatura de ${m}/${y}\n\n` + l.map(r => `${r.previsto ? 'prev.' : fmtD(r.data)}  ${r.descricao}${r.categoria ? ' (' + r.categoria + ')' : ''}  ${brl(r.valor)}`).join('\n') +
    `\n\nTotal: ${brl(l.reduce((s, r) => s + r.valor, 0))}`;
}

/* ---------- Tela ---------- */
const ICO = {Mercado: '🛒', 'Alimentação': '🍽️', Transporte: '🚗', 'Saúde': '💊', Assinaturas: '📺', Compras: '🛍️', Casa: '🏠', 'Educação': '📚', Lazer: '🎬', Outros: '✨'};
const PAL = ['#1e4d3b', '#4f8a68', '#8fbf9f', '#c5dccb', '#d9a441', '#9aa89f', '#e8e2d3'];
const opts = c => '<option value="">Sem categoria</option>' + cats.map(x => `<option${x === c ? ' selected' : ''}>${esc(x)}</option>`).join('') + (c && !cats.includes(c) ? `<option selected>${esc(c)}</option>` : '') + '<option value="__novo__">+ Nova categoria…</option>';
function setAba(a) {
  ['gastos', 'analise', 'prev'].forEach(x => $('#v-' + x).hidden = x !== a);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.a === a));
  scrollTo({top: 0});
}
let filtro = null;
function render() {
  const adm = perfil.admin, alvo = adm ? PESSOAS : ['Nice', 'Milton'];
  $('#acts').hidden = !adm;
  const tot = p => rows.filter(r => r.dono === p).reduce((s, r) => s + r.valor, 0);
  const sem = rows.filter(r => !r.dono).length, pv = rows.some(r => r.previsto);
  if (filtro && filtro !== '_sem' && !alvo.includes(filtro)) filtro = null;
  if (filtro === '_sem' && !sem) filtro = null;
  const pessoa = filtro && filtro !== '_sem';
  $('#total').textContent = brl(pessoa ? tot(filtro) : alvo.reduce((s, p) => s + tot(p), 0));
  $('#hlt').textContent = pessoa ? 'Total · ' + filtro : 'Total do mês';
  $('#hp').textContent = pv ? 'inclui previsão' : '';
  $('#sum').innerHTML = alvo.map(p => `<div class="card who"><span class="dot" style="background:${cor(p)}"></span><b>${p}</b><span class="v">${brl(tot(p))}</span><button class="ghost" data-act="copiar" data-p="${p}">Copiar</button></div>`).join('');
  $('#chips').innerHTML = ['', ...alvo, ...(adm && sem ? ['_sem'] : [])].map(f => `<button class="chip${(filtro || '') === f ? ' on' : ''}" data-act="filtro" data-f="${f}">${f === '' ? 'Todos' : f === '_sem' ? 'Sem dono' : f}</button>`).join('');
  $('#tl').textContent = 'Gastos' + (adm && sem && !filtro ? ` · ${sem} sem dono` : '');
  const vis = rows.map((r, i) => [r, i]).filter(([r]) => !filtro || (filtro === '_sem' ? !r.dono : r.dono === filtro));
  $('#list').innerHTML = vis.length ? vis.map(([r, i]) =>
    `<div class="row"><div class="ic">${ICO[r.categoria] || '🧾'}</div><div class="rb"><div class="l"><div class="d">${esc(r.descricao)}<div class="mut">${r.previsto ? '<span class="tag">previsto</span>' : fmtD(r.data)}${!adm && r.dono ? ' &nbsp;<span class="dot" style="display:inline-block;background:' + cor(r.dono) + '"></span> ' + r.dono : ''}</div></div><div class="v">${brl(r.valor)}</div></div>` +
    `<select class="cat" data-i="${i}" aria-label="Categoria">${opts(r.categoria)}</select>` +
    (adm ? `<div class="pick">${PESSOAS.map(p => `<button data-act="dono" data-i="${i}" data-p="${p}" class="${r.dono === p ? 'on' : ''}" style="${r.dono === p ? 'background:' + cor(p) : ''}">${p}</button>`).join('')}</div>` : '') + `</div></div>`
  ).join('') : `<div class="empty mut">${rows.length ? 'Nenhum gasto neste filtro.' : adm ? 'Nenhuma fatura neste mês. Toque em “Enviar fatura”.' : 'Ainda não há gastos neste mês.'}</div>`;
  renderAnalise(vis.map(x => x[0]));
}
function renderAnalise(lista) {
  const por = {}; lista.filter(r => r.dono && r.valor > 0).forEach(r => { const c = r.categoria || 'Sem categoria'; por[c] = (por[c] || 0) + r.valor; });
  const e = Object.entries(por).sort((a, b) => b[1] - a[1]), tot = e.reduce((s, x) => s + x[1], 0);
  if (!tot) { $('#donut').innerHTML = '<div class="empty mut">Sem gastos neste filtro.</div>'; return; }
  const top = e.slice(0, 6), resto = e.slice(6).reduce((s, x) => s + x[1], 0); if (resto) top.push(['Outras', resto]);
  let acc = 0; const seg = top.map(([, v], i) => { const a = acc / tot * 100; acc += v; return `${PAL[i]} ${a}% ${acc / tot * 100}%`; }).join(',');
  $('#donut').innerHTML = `<div class="donut" style="background:conic-gradient(${seg})"><div class="dc"><span class="mut">Total</span><b>${brl(tot)}</b></div></div><div class="leg">${top.map(([n, v], i) => `<span><i class="dot" style="background:${PAL[i]}"></i>${esc(n)}<em>${Math.round(v / tot * 100)}%</em></span>`).join('')}</div>`;
}
const SOL = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const LUA = '<svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>';
function tema(troca) {
  const d = document.documentElement;
  let t = d.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  if (troca) { t = t === 'dark' ? 'light' : 'dark'; d.dataset.theme = t; try { localStorage.setItem('tema', t); } catch (e) {} }
  $('#tema').innerHTML = t === 'dark' ? SOL : LUA;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0e1411' : '#1e4d3b';
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'entrar') {
    const {error} = await sb.auth.signInWithPassword({email: $('#email').value.trim(), password: $('#senha').value});
    if (error) return toast('E-mail ou senha incorretos.');
    iniciar();
  }
  if (a === 'sair') { await sb.auth.signOut(); location.reload(); }
  if (a === 'dono') { const r = rows[b.dataset.i]; r.dono = r.dono === b.dataset.p ? null : b.dataset.p; render(); }
  if (a === 'salvar') salvar();
  if (a === 'mes') { mes = b.dataset.m; $('#mes').value = mes; carregar(); setAba('gastos'); }
  if (a === 'aba') setAba(b.dataset.a);
  if (a === 'filtro') { filtro = b.dataset.f || null; render(); }
  if (a === 'tema') tema(true);
  if (a === 'copiar') { await navigator.clipboard.writeText(mensagem(b.dataset.p)); toast('Resumo de ' + b.dataset.p + ' copiado'); }
});
$('#csv').addEventListener('change', async e => { const f = e.target.files[0]; if (f) importCSV(await f.text()); e.target.value = ''; });
$('#list').addEventListener('change', e => { if (e.target.matches('select.cat')) setCat(+e.target.dataset.i, e.target.value); });
$('#mes').addEventListener('change', e => { mes = e.target.value; carregar(); });

async function iniciar() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; $('#app').hidden = true; return; }
  const {data: p} = await sb.from('perfis').select('*').maybeSingle();
  if (!p) { toast('Seu acesso ainda não foi liberado.'); await sb.auth.signOut(); $('#login').hidden = false; return; }
  perfil = p;
  if (p.admin) { const {data} = await sb.from('regras').select('*'); (data || []).forEach(x => regras[x.descricao] = x.dono); }
  const {data: c} = await sb.from('categorias').select('nome').order('nome'); cats = (c || []).map(x => x.nome);
  const {data: rc} = await sb.from('regras_categoria').select('*'); (rc || []).forEach(x => regCat[x.grupo + ':' + x.descricao] = x.categoria);
  $('#login').hidden = true; $('#app').hidden = false;
  $('#ola').textContent = 'Olá, ' + p.nome;
  $('#mes').value = mes;
  carregar();
}
tema();
iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
