<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fatura compartilhada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f7;--card:#fff;--tx:#16181d;--mut:#6b7280;--line:#e5e7eb;--ac:#0f766e;
--c0:#0f766e;--c1:#7c5cd6;--c2:#d9822b;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--card:#1a1d21;--tx:#f1f2f4;--mut:#9aa1ab;--line:#2a2e34;--ac:#2dd4bf;--c0:#2dd4bf;--c1:#a78bfa;--c2:#f0a14f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 72px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:28px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mut{color:var(--mut);font-size:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:500}
@media(prefers-color-scheme:dark){.btn{color:#0b1b19}}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--tx)}
.link{background:none;border:0;color:var(--mut);padding:4px}
input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.login{margin-top:12vh;display:grid;gap:10px}
.login p{margin:0 0 8px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input{width:auto;flex:1;min-width:150px}
.file{flex:1;min-width:150px;text-align:center}
.sum{display:grid;gap:10px}
.who{display:flex;align-items:center;gap:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.who b{font-weight:500;flex:1}
.who .v{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.row{padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{display:flex;justify-content:space-between;gap:12px}
.row .d{overflow-wrap:anywhere}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.pick{display:flex;gap:6px;margin-top:8px}
.pick button{flex:1;border:1px solid var(--line);background:none;border-radius:9px;padding:7px 0;font-size:14px;color:var(--mut)}
.pick button.on{color:#fff;border-color:transparent;font-weight:500}
.empty{text-align:center;padding:28px 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="login" class="login" hidden>
  <h1>Fatura compartilhada</h1>
  <p class="mut">Entre para ver os seus gastos do cartão.</p>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username">
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="btn" data-act="entrar">Entrar</button>
</section>

<section id="app" hidden>
  <div class="top"><h1 id="ola"></h1><button class="link" data-act="sair">Sair</button></div>
  <div class="bar">
    <input id="mes" type="month" aria-label="Mês da fatura">
    <label class="ghost file" id="up" hidden>Enviar fatura (CSV)<input id="csv" type="file" accept=".csv,text/csv" hidden></label>
  </div>
  <h2>Resumo do mês</h2>
  <div class="sum" id="sum"></div>
  <h2 id="tl">Gastos</h2>
  <div class="card" id="list"></div>
  <div class="bar" id="savebar" style="margin-top:16px" hidden><button class="btn" style="flex:1" data-act="salvar">Salvar fatura</button></div>
</section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== CONFIGURE AQUI ====== */
const SUPABASE_URL = 'https://omobvxdlytdqgzznmhso.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hc6Cu58Q14nzMsqOkG5wgQ_GkD8rvbA';
const PESSOAS = ['Larissa', 'Nice', 'Milton'];
/* ============================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtD = d => d ? d.slice(8) + '/' + d.slice(5, 7) : '';
const norm = d => d.toLowerCase().replace(/\d+\s*\/\s*\d+/g, '').replace(/\s+/g, ' ').trim();
const cor = p => `var(--c${PESSOAS.indexOf(p)})`;
let perfil = null, rows = [], regras = {}, mes = new Date().toISOString().slice(0, 7);

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2200); }

/* ---------- CSV ---------- */
function parseCSV(t) {
  t = t.replace(/^\uFEFF/, '');
  const f = t.split(/\r?\n/)[0];
  const sep = (f.match(/;/g) || []).length > (f.match(/,/g) || []).length ? ';' : ',';
  const out = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); out.push(r); r = []; c = ''; }
    else c += ch;
  }
  if (c || r.length) { r.push(c); out.push(r); }
  return out.filter(x => x.some(y => y.trim()));
}
function num(s) { s = String(s).replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); }
function toISO(s) {
  s = s.trim(); let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  m = s.match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : null;
}
function importCSV(text) {
  const t = parseCSV(text), h = t[0].map(x => x.toLowerCase());
  const ix = (re, not = -1) => h.findIndex((x, i) => i !== not && re.test(x));
  const iD = ix(/data|date/), iT = ix(/descri|t[ií]tulo|title|hist|estabel|lan[cç]amento/, iD), iV = ix(/valor|amount|value/);
  if (iD < 0 || iT < 0 || iV < 0) return toast('Não achei as colunas de data, descrição e valor.');
  rows = t.slice(1).map(r => ({data: toISO(r[iD] || ''), descricao: (r[iT] || '').trim(), valor: num(r[iV])}))
    .filter(r => r.descricao && !isNaN(r.valor))
    .map(r => ({...r, dono: regras[norm(r.descricao)] || null}));
  render();
  toast(rows.length + ' gastos importados. Confira os donos e salve.');
}

/* ---------- Dados ---------- */
async function carregar() {
  const {data, error} = await sb.from('gastos').select('*').eq('mes', mes).order('data');
  if (error) return toast(error.message);
  rows = data; render();
}
async function salvar() {
  const ins = rows.map(({data, descricao, valor, dono}) => ({mes, data, descricao, valor, dono}));
  let r = await sb.from('gastos').delete().eq('mes', mes);
  if (r.error) return toast(r.error.message);
  if (ins.length) { r = await sb.from('gastos').insert(ins); if (r.error) return toast(r.error.message); }
  const m = {}; rows.forEach(x => x.dono && (m[norm(x.descricao)] = x.dono));
  const rg = Object.entries(m).map(([descricao, dono]) => ({descricao, dono}));
  if (rg.length) await sb.from('regras').upsert(rg);
  Object.assign(regras, m);
  await carregar(); toast('Fatura salva');
}
function mensagem(p) {
  const l = rows.filter(r => r.dono === p), [y, m] = mes.split('-');
  return `Oi, ${p}! Fatura de ${m}/${y}\n\n` + l.map(r => `${fmtD(r.data)}  ${r.descricao}  ${brl(r.valor)}`).join('\n') +
    `\n\nTotal: ${brl(l.reduce((s, r) => s + r.valor, 0))}`;
}

/* ---------- Tela ---------- */
function render() {
  const adm = perfil.admin;
  $('#up').hidden = $('#savebar').hidden = !adm;
  const alvo = adm ? PESSOAS : [perfil.nome];
  $('#sum').innerHTML = alvo.map(p => {
    const t = rows.filter(r => r.dono === p).reduce((s, r) => s + r.valor, 0);
    return `<div class="card who"><span class="dot" style="background:${cor(p)}"></span><b>${p}</b><span class="v">${brl(t)}</span>` +
      (adm ? `<button class="ghost" data-act="copiar" data-p="${p}">Copiar</button>` : '') + `</div>`;
  }).join('');
  const sem = rows.filter(r => !r.dono).length;
  $('#tl').textContent = adm && sem ? `Gastos (${sem} sem dono)` : 'Gastos';
  $('#list').innerHTML = rows.length ? rows.map((r, i) =>
    `<div class="row"><div class="l"><div class="d">${esc(r.descricao)}<div class="mut">${fmtD(r.data)}</div></div><div class="v">${brl(r.valor)}</div></div>` +
    (adm ? `<div class="pick">${PESSOAS.map(p => `<button data-act="dono" data-i="${i}" data-p="${p}" class="${r.dono === p ? 'on' : ''}" style="${r.dono === p ? 'background:' + cor(p) : ''}">${p}</button>`).join('')}</div>` : '') + `</div>`
  ).join('') : `<div class="empty mut">${adm ? 'Nenhuma fatura neste mês. Envie o CSV para começar.' : 'Ainda não há gastos neste mês.'}</div>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'entrar') {
    const {error} = await sb.auth.signInWithPassword({email: $('#email').value.trim(), password: $('#senha').value});
    if (error) return toast('E-mail ou senha incorretos.');
    iniciar();
  }
  if (a === 'sair') { await sb.auth.signOut(); location.reload(); }
  if (a === 'dono') { const r = rows[b.dataset.i]; r.dono = r.dono === b.dataset.p ? null : b.dataset.p; render(); }
  if (a === 'salvar') salvar();
  if (a === 'copiar') { await navigator.clipboard.writeText(mensagem(b.dataset.p)); toast('Resumo de ' + b.dataset.p + ' copiado'); }
});
$('#csv').addEventListener('change', async e => { const f = e.target.files[0]; if (f) importCSV(await f.text()); e.target.value = ''; });
$('#mes').addEventListener('change', e => { mes = e.target.value; carregar(); });

async function iniciar() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; $('#app').hidden = true; return; }
  const {data: p} = await sb.from('perfis').select('*').maybeSingle();
  if (!p) { toast('Seu acesso ainda não foi liberado.'); await sb.auth.signOut(); $('#login').hidden = false; return; }
  perfil = p;
  if (p.admin) { const {data} = await sb.from('regras').select('*'); (data || []).forEach(x => regras[x.descricao] = x.dono); }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#ola').textContent = 'Olá, ' + p.nome;
  $('#mes').value = mes;
  carregar();
}
iniciar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
